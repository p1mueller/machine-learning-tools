[project]
name = "ml-tools"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "matplotlib>=3.10.6",
    "matplotlib-label-lines>=0.8.1",
    "numpy>=2.3.3",
    "pydantic>=2.12.3",
    "pydantic-numpy>=8.0.1",
    "pyqt6>=6.9.1",
    "scikit-learn>=1.7.2",
    "seaborn>=0.13.2",
    "statsmodels>=0.14.5",
]

[build-system]
requires = ["uv_build>=0.8.17,<0.9.0"]
build-backend = "uv_build"

[tool.ruff.format]
line-ending = "auto"

[tool.ruff]
line-length = 100
target-version = "py38"

[tool.ruff.lint]
select = ["F", "E", "W", "D", "I"]
ignore = ["E203", "E501", "D105", "D202", "D203", "D213"]
#
[tool.ruff.lint.pydocstyle]
convention = "google"

[dependency-groups]
dev = [
    "pytest>=8.4.2",
    "ruff>=0.14.2",
]
