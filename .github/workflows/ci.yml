name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  UV_LINK_MODE: copy

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: git-lfs/setup-action@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.9"
          python-version: "3.12"
          enable-cache: true
      - run: uv sync --frozen

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: git-lfs/setup-action@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.9"
          python-version: "3.12"
          enable-cache: true
      - run: uv sync --frozen
      - run: uv run ruff check --output-format=github

  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: git-lfs/setup-action@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.9"
          python-version: "3.12"
          enable-cache: true
      - run: uv sync --frozen
      - run: uv run ty check src

  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: git-lfs/setup-action@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.9"
          python-version: "3.12"
          enable-cache: true
      - run: uv sync --frozen
      - run: >-
          uv run pytest -v --junitxml=test-report.xml
          --cov=ml_tools --cov-report=term-missing --cov-report=xml:coverage-report.xml
          --cov-fail-under=80
      - uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: |
            test-report.xml
            coverage-report.xml

  docs:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      contents: read
      pages: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: git-lfs/setup-action@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.9"
          python-version: "3.12"
          enable-cache: true
      - run: uv sync --frozen
      - run: uv run mkdocs build --strict --site-dir docs-site
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs-site
      - uses: actions/deploy-pages@v4
        id: deployment
