<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>__TITLE__</title>
  <style>
    body {
      font-family: -apple-system, 'Segoe UI', Roboto, sans-serif;
      margin: 2rem auto;
      max-width: 1200px;
      color: #1a202c;
      padding: 0 1rem;
    }

    h1 {
      border-bottom: 2px solid #0C273A;
      padding-bottom: .4rem;
    }

    h2 {
      color: #0C273A;
      margin-top: 2rem;
    }

    table {
      border-collapse: collapse;
      /* width: 100%; */
    }

    td {
      border: 1px solid #e2e8f0;
      padding: .45rem .7rem;
    }

    tr:nth-child(odd) {
      background: #f7fafc;
    }

    td.value {
      text-align: right;
      font-variant-numeric: tabular-nums;
    }

    td.flagged,
    .badge.warn {
      color: #b83280;
      font-weight: 600;
    }

    td.ok,
    .badge.ok {
      color: #2f855a;
    }

    .badge {
      float: right;
      padding: .3rem .8rem;
      border-radius: 999px;
      background: #edf2f7;
    }

    .figures {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(420px, 1fr));
      gap: 1.2rem;
    }

    figure {
      margin: 0;
      text-align: center;
    }

    figure img {
      max-width: 100%;
      border: 1px solid #e2e8f0;
      border-radius: 6px;
    }

    figcaption {
      font-size: .85rem;
      color: #4a5568;
      margin-top: .4rem;
    }
  </style>
</head>

<body>
  <h1>__TITLE__</h1>
  <section>
    <h2>Model Statistics</h2>
    <table>
      __STATS_ROWS__
    </table>
  </section>
  <section>
    <h2>Predictors</h2>
    <table>
      <tr>
        <td>Name</td>
        <td class='value'>VIF</td>
        <td>Status</td>
      </tr>
      __PREDICTOR_ROWS__
    </table>
  </section>
  <section>
    <h2>Problematic Samples</h2>
    <table>
      <tr>
        <td>Category</td>
        <td class='value'>Count</td>
        <td>Indices</td>
      </tr>
      __PROBLEM_ROWS__
    </table>
  </section>
  __FIGURES_SECTION__
</body>

</html>
