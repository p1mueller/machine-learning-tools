[project]
name = "ml-tools"
version = "0.1.0"
description = "Model adequacy checking and utility datasets for linear regression."
license = "MIT"
license-files = ["LICENSE"]
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "matplotlib>=3.10.6",
  "matplotlib-label-lines>=0.8.1",
  "numpy>=2.3.3",
  "pydantic>=2.12.3",
  "pydantic-numpy>=8.0.1",
  "scikit-learn>=1.7.2",
  # 0.15.0 (released 2026-08-27) has no cp312 wheels; pin until one exists
  "statsmodels>=0.14.5,<0.15",
]

[build-system]
requires = ["uv_build>=0.8.17,<0.9.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
wheel = ["src/ml_tools/mac/templates/*.html"]

[tool.ruff.format]
line-ending = "auto"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["F", "E", "W", "D", "I"]
ignore = ["E203", "E501", "D105", "D202", "D203", "D213"]
#
[tool.ruff.lint.pydocstyle]
convention = "google"

[dependency-groups]
dev = [
  "griffe-pydantic>=1.3.1",
  "mkdocs>=1.6",
  "mkdocs-api-autonav>=0.4.0",
  "mkdocs-autoapi>=0.4.1",
  "mkdocs-material>=9.6",
  "mkdocstrings[python]>=0.29",
  "pre-commit>=4.6.2",
  "pyqt6>=6.11.0",
  "pytest>=8.4.2",
  "pytest-cov>=7.0.0",
  "ruff>=0.14.2",
  "ty>=0.0.74",
]
