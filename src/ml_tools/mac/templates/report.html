<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>__TITLE__</title>
  <style>
    :root {
      --ink: #182230;
      --muted: #5b6b7f;
      --line: #e4e9f1;
      --bg: #f3f5f9;
      --card: #ffffff;
      --accent: #0C273A;
      --ok-bg: #e8f5ee;
      --ok: #1c7c46;
      --warn-bg: #fdeff4;
      --warn: #b83280;
      --radius: 12px;
    }

    * {
      box-sizing: border-box;
    }

    body {
      font-family: ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
      margin: 0;
      background: var(--bg);
      color: var(--ink);
      line-height: 1.5;
      -webkit-font-smoothing: antialiased;
    }

    .page {
      max-width: 1200px;
      margin: 0 auto;
      padding: 2.5rem 1.25rem 4rem;
    }

    .masthead {
      border-bottom: 1px solid var(--line);
      display: flex;
      align-items: flex-end;
      justify-content: space-between;
      gap: 1rem;
      flex-wrap: wrap;
      margin-bottom: 1.75rem;
    }

    h1 {
      font-size: 1.65rem;
      font-weight: 700;
      letter-spacing: -0.02em;
      margin: 0;
      color: var(--accent);
      padding-bottom: .5rem;
      border-bottom: 3px solid var(--accent);
    }

    .badge {
      white-space: nowrap;
      padding: .35rem .9rem;
      border-radius: 999px;
      font-size: .8rem;
      font-weight: 600;
    }

    .badge.ok {
      background: var(--ok-bg);
      color: var(--ok);
    }

    .badge.warn {
      background: var(--warn-bg);
      color: var(--warn);
    }

    section {
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: var(--radius);
      box-shadow: 0 1px 2px rgba(16, 24, 40, .04);
      padding: 1.5rem;
      margin: 0 0 1.5rem;
    }

    h2 {
      font-size: .8rem;
      text-transform: uppercase;
      letter-spacing: .08em;
      color: var(--muted);
      margin: 0 0 1rem;
      font-weight: 600;
    }

    .stats {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(130px, 1fr));
      gap: .75rem;
    }

    .stat {
      background: #f8fafc;
      border: 1px solid var(--line);
      border-radius: 10px;
      padding: .7rem .9rem;
    }

    .stat-value {
      font-size: 1.25rem;
      font-weight: 650;
      color: var(--accent);
      font-variant-numeric: tabular-nums;
    }

    .stat-label {
      font-size: .72rem;
      color: var(--muted);
      margin-top: .15rem;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      font-size: .92rem;
    }

    th {
      text-align: left;
      font-size: .72rem;
      text-transform: uppercase;
      letter-spacing: .06em;
      color: var(--muted);
      font-weight: 600;
      border-bottom: 2px solid var(--line);
      padding: .4rem .6rem;
    }

    td {
      padding: .55rem .6rem;
      border-bottom: 1px solid var(--line);
    }

    tbody tr:last-child td {
      border-bottom: none;
    }

    tbody tr:hover {
      background: #f8fafc;
    }

    th.value,
    td.value {
      text-align: right;
      font-variant-numeric: tabular-nums;
    }

    .indices {
      color: var(--muted);
      font-size: .85rem;
    }

    .chip {
      display: inline-flex;
      align-items: center;
      gap: .4rem;
      padding: .15rem .65rem;
      border-radius: 999px;
      font-size: .78rem;
      font-weight: 600;
      white-space: nowrap;
    }

    .chip::before {
      content: '';
      width: .45rem;
      height: .45rem;
      border-radius: 50%;
      background: currentColor;
    }

    .chip.ok {
      background: var(--ok-bg);
      color: var(--ok);
    }

    .chip.flagged {
      background: var(--warn-bg);
      color: var(--warn);
    }

    .figures {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(430px, 1fr));
      gap: 1.4rem;
      align-items: start;
    }

    figure {
      margin: 0;
      background: #fff;
      border: 1px solid var(--line);
      border-radius: 10px;
      padding: .9rem;
      box-shadow: 0 1px 2px rgba(16, 24, 40, .04);
    }

    figure img {
      width: 100%;
      height: auto;
      border-radius: 6px;
    }

    figcaption {
      font-size: .82rem;
      color: var(--muted);
      text-align: center;
      margin-top: .6rem;
    }

    .colophon {
      text-align: center;
      color: var(--muted);
      font-size: .78rem;
      margin-top: 2rem;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --ink: #e5eaf1;
        --muted: #93a1b5;
        --line: #2a3645;
        --bg: #10161f;
        --card: #17202c;
        --accent: #9fc1ff;
        --ok-bg: #10281c;
        --ok: #4fce8b;
        --warn-bg: #2d1524;
        --warn: #f07ab8;
      }

      .stat {
        background: #1b2532;
      }

      tbody tr:hover {
        background: #1b2532;
      }
    }

    @media print {

      body,
      .page {
        background: #fff;
        padding: 0;
      }

      section,
      figure,
      .stat {
        box-shadow: none;
        break-inside: avoid;
      }
    }
  </style>
</head>

<body>
  <div class="page">
    <header class="masthead">
      <h1>__TITLE__</h1>
      __BADGE__
    </header>
    <section>
      <h2>Model Statistics</h2>
      <div class="stats">
        __STATS_CARDS__
      </div>
    </section>
    <section>
      <h2>Predictors</h2>
      <table>
        <thead>
          <tr>
            <th>Name</th>
            <th class="value">VIF</th>
            <th class="value">p-value</th>
            <th>Status</th>
          </tr>
        </thead>
        <tbody>
          __PREDICTOR_ROWS__
        </tbody>
      </table>
    </section>
    <section>
      <h2>Problematic Samples</h2>
      <table>
        <thead>
          <tr>
            <th>Category</th>
            <th class="value">Count</th>
            <th>Indices</th>
          </tr>
        </thead>
        <tbody>
          __PROBLEM_ROWS__
        </tbody>
      </table>
    </section>
    __FIGURES_SECTION__
    <footer class="colophon">Generated by ml-tools &middot; Model Adequacy Checking</footer>
  </div>
</body>

</html>
